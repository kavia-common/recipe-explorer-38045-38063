<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In - 11-235</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Using Poppins to match typography tokens -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./common.css">
  <link rel="stylesheet" href="./sign-in-11-235.css">
</head>
<body>
  <!-- Screen container from root: width 375, height 812 -->
  <div id="screen-sign-in-11-235" class="figma-screen figma-rel" aria-label="Sign In Screen">
    <!-- Status Bar (approximation) -->
    <div id="comp-status-bar" class="figma-abs" style="left: 0px; top: 0px; width: 375px; height: 44px;">
      <div class="figma-abs" style="left: 293.5px; top: 16.6px; width: 68px; height: 13px;">
        <!-- Battery tip -->
        <div class="figma-abs" style="left: 336px; top: 17.16px; width: 24.5px; height: 11.5px;">
          <div class="figma-abs" style="left: 23px; top: 3.69px; width: 1.5px; height: 4px; background: var(--color-000000);"></div>
        </div>
        <!-- Cellular bars -->
        <div class="figma-abs" style="left: 0px; top: 1.6px; width: 17.1px; height: 10.7px;">
          <div class="figma-abs" style="left: 0px; top: 6.7px; width: 3px; height: 4px; background: var(--color-000000); border-radius: 1.2px;"></div>
          <div class="figma-abs" style="left: 4.8px; top: 4.7px; width: 3px; height: 6px; background: var(--color-000000); border-radius: 1.2px;"></div>
          <div class="figma-abs" style="left: 9.4px; top: 2.4px; width: 3px; height: 8.3px; background: var(--color-000000); border-radius: 1.2px;"></div>
          <div class="figma-abs" style="left: 14.1px; top: 0px; width: 3px; height: 10.7px; background: var(--color-000000); border-radius: 1.2px;"></div>
        </div>
        <!-- Wi-Fi -->
        <div class="figma-abs" style="left: 22.1px; top: 1.4px; width: 15.4px; height: 11.06px;">
          <div class="figma-abs" style="left: 0px; top: 0px; width: 15.4px; height: 1px; background: var(--color-000000);"></div>
        </div>
      </div>
      <!-- Time -->
      <div class="figma-abs" style="left: 0px; top: 12px; width: 180px; height: 22px;">
        <span class="time" style="position:absolute; left:29.5px; top:2px;">19:27</span>
      </div>
    </div>

    <!-- Title group -->
    <div id="title-group" class="figma-abs" style="left: 30px; top: 94px; width: 155px; height: 75px;">
      <p id="hello-text" class="text-hello figma-abs" style="left: 0px; top: 0px; width: 84px; height: 45px;">Hello,</p>
      <p id="welcome-text" class="text-welcome figma-abs" style="left: 0px; top: 45px; width: 155px; height: 30px;">Welcome Back!</p>
    </div>

    <!-- Input field (Email) group -->
    <div id="input-email" class="figma-abs" style="left: 30px; top: 226px; width: 315px; height: 81px;">
      <label class="figma-abs label" for="email" style="left: 0px; top: 0px; width: 38px; height: 21px;">Email</label>
      <div class="figma-abs input-rect" style="left: 0px; top: 26px; width: 315px; height: 55px;"></div>
      <input id="email" name="email" type="email" aria-label="Email" placeholder="Enter Email"
        class="figma-abs" style="left: 14px; top: 34px; width: 287px; height: 39px; border:none; outline:none; background:transparent; font-family: var(--typo-65-family); font-size: var(--typo-65-size); color: var(--typo-66-color);" />
    </div>

    <!-- Input field (Password) group -->
    <div id="input-password" class="figma-abs" style="left: 30px; top: 337px; width: 315px; height: 81px;">
      <label class="figma-abs label" for="password" style="left: 0px; top: 0px; width: 107px; height: 21px;">Enter Password</label>
      <div class="figma-abs input-rect" style="left: 0px; top: 26px; width: 315px; height: 55px;"></div>
      <input id="password" name="password" type="password" aria-label="Password" placeholder="Enter Password"
        class="figma-abs" style="left: 14px; top: 34px; width: 287px; height: 39px; border:none; outline:none; background:transparent; font-family: var(--typo-65-family); font-size: var(--typo-65-size); color: var(--typo-66-color);" />
    </div>

    <!-- Big Button (Sign In) -->
    <button id="big-button" class="figma-abs big-button" style="left: 30px; top: 480px; width: 315px; height: 60px;" aria-label="Sign In">
      <span class="btn-label">Sign In</span>
      <span class="btn-icon" aria-hidden="true"></span>
    </button>

    <!-- Or Sign in With line group -->
    <div id="or-line" class="figma-abs" style="left: 90px; top: 560px; width: 195px; height: 17px;">
      <div class="figma-abs line" style="left: 0px; top: 9px; width: 50px; height: 1px;"></div>
      <p class="figma-abs or-text" style="left: 57px; top: 0px; width: 81px; height: 17px;">Or Sign in With</p>
      <div class="figma-abs line" style="left: 145px; top: 9px; width: 50px; height: 1px;"></div>
    </div>

    <!-- Social buttons -->
    <div id="btn-google" class="figma-abs" style="left: 131px; top: 597px; width: 44px; height: 44px;">
      <div class="figma-abs btn-social-bg" style="left: 0px; top: 0px; width: 44px; height: 44px;"></div>
      <!-- Use provided figma image path exactly -->
      <img alt="Google Icon" class="figma-abs icon-img" src="figmaimages/figma_image_13_39.svg" style="left: 12px; top: 12px; width: 20px; height: 20px">
      <button aria-label="Sign in with Google" style="position:absolute; left:0; top:0; width:44px; height:44px; opacity:0; border:none; background:transparent; cursor:pointer;"></button>
    </div>

    <div id="btn-facebook" class="figma-abs" style="left: 200px; top: 597px; width: 44px; height: 44px;">
      <div class="figma-abs btn-social-bg" style="left: 0px; top: 0px; width: 44px; height: 44px;"></div>
      <img alt="Facebook Icon" class="figma-abs icon-img" src="figmaimages/figma_image_13_58.svg" style="left: 10px; top: 10px; width: 24px; height: 24px">
      <button aria-label="Sign in with Facebook" style="position:absolute; left:0; top:0; width:44px; height:44px; opacity:0; border:none; background:transparent; cursor:pointer;"></button>
    </div>

    <!-- Bottom text: Don’t have an account? Sign up -->
    <p id="signup-text" class="figma-abs signup-link" style="left: 99px; top: 696px; width: 177px; height: 17px;">Don’t have an account? Sign up</p>

    <!-- Home Indicator -->
    <div id="home-indicator" class="figma-abs" style="left: 0px; top: 730px; width: 375px; height: 34px;">
      <div class="figma-abs" style="left: 120px; top: 21px; width: 135px; height: 5px; background: var(--style-32-background); border-radius: 100px;"></div>
    </div>
  </div>

  <script src="./app.js"></script>
  <script src="./sign-in-11-235.js"></script>
</body>
</html>
